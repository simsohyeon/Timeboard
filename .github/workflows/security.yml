# PR 과 main 푸시마다 보안 검사: 비밀키(Gitleaks) · 코드 패턴(Semgrep) · 의존성 취약점(npm audit) · 빌드
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 (새로 알려진 취약점 확인)

# 저장소 읽기만 — 배포용 비밀값은 쓰지 않는다 (외부 PR 에서도 안전)
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git 이력 전체 검사
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/javascript --config p/react --config p/secrets --config p/sql-injection \
            --metrics=off --error frontend/src frontend/public supabase

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 의존성 취약점 (high 이상이면 실패)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
